<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101b2e" />
    <meta name="description" content="Practice usable security with an interactive mock exam, instant feedback, and score tracking." />
    <title>Usable Security — Mock Exam</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <script src="question-data.js" defer></script>
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Main navigation">
        <a class="brand" href="#" data-action="navigate" data-view="dashboard" aria-label="Usable Security home">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 36 40" fill="none"><path d="M18 2.5 32 8v10.3c0 8.3-5.7 14.6-14 19.2C9.7 32.9 4 26.6 4 18.3V8l14-5.5Z" stroke="currentColor" stroke-width="2.6"/><path d="m11.8 19.2 4.1 4.1 8.6-9" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
          <span class="brand-copy"><strong>usable<span>security</span></strong><small>LEARNING LAB</small></span>
        </a>

        <div class="nav-label">YOUR STUDY SPACE</div>
        <nav class="primary-nav">
          <button class="nav-link is-active" data-action="navigate" data-view="dashboard">
            <span class="nav-icon" aria-hidden="true">⌂</span> Dashboard
          </button>
          <button class="nav-link" data-action="navigate" data-view="practice">
            <span class="nav-icon nav-icon-grid" aria-hidden="true">▦</span> Practice exam
          </button>
          <button class="nav-link" data-action="navigate" data-view="scores">
            <span class="nav-icon" aria-hidden="true">↗</span> My scores
            <span class="nav-count" id="score-count">0</span>
          </button>
          <button class="nav-link" data-action="navigate" data-view="topics">
            <span class="nav-icon nav-icon-book" aria-hidden="true">▤</span> Topic library
          </button>
        </nav>

        <div class="sidebar-bottom">
          <div class="security-note">
            <span class="note-orbit" aria-hidden="true">✳</span>
            <p><strong>Security is a practice.</strong><br />Small sessions. Strong instincts.</p>
            <span class="note-line" aria-hidden="true"></span>
          </div>
          <div class="sidebar-footer"><span class="online-dot"></span> Your progress is saved on this device</div>
        </div>
      </aside>

      <div class="workspace">
        <header class="topbar">
          <div class="breadcrumb"><span>LEARNING LAB</span><span class="crumb-slash">/</span><strong id="current-crumb">Dashboard</strong></div>
          <div class="topbar-right">
            <span class="course-chip"><span class="chip-dot"></span> USABLE SECURITY</span>
            <span class="topbar-divider"></span>
            <span class="avatar" aria-label="Student profile">S</span>
          </div>
        </header>
        <main id="main-content" tabindex="-1"></main>
      </div>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
